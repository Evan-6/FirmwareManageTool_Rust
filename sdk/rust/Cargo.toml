[package]
name = "gdb"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "GDBOX host SDK: device management, mouse/keyboard control, motion and automation"

[dependencies]
gdb-motion = { path = "../motion" }
input-protocol = { path = "../../shared/input-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "=2.6.7", default-features = false }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
input-protocol = { path = "../../shared/input-protocol" }
