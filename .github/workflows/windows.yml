name: Windows build and portable package
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Validate v3 bootloader helper
        shell: pwsh
        run: ./scripts/test-v3-bootloader.ps1
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FirmwareManageTool_Rust-windows-x64
          path: dist/*.zip
  pure-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo test --locked --workspace --exclude firmware-manage-tool-app
      - run: python3 scripts/sync-input-protocol.py --check
      # Keeps the Rust engine honest: it must build for the RP2040 core without std.
      - run: rustup target add thumbv6m-none-eabi
      - run: cargo build --locked -p firmware-engine --release --target thumbv6m-none-eabi

  rust-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
          components: rustfmt, clippy
      - name: Adapter tests (mock transport, host)
        run: cargo test --locked --manifest-path firmware/app/Cargo.toml
      - name: Lint the firmware for the real target
        run: |
          cargo clippy --locked --manifest-path firmware/app/Cargo.toml \
            --target thumbv6m-none-eabi --features hardware -- -D warnings
      - name: Build and package the UF2
        run: bash scripts/build-rust-firmware.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xiao-firmware-rust
          path: firmware/app/target/thumbv6m-none-eabi/release/*.uf2
