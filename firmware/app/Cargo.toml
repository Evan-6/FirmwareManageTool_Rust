[package]
name = "xiao-firmware"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Seeed XIAO RP2040 Vendor HID v3 firmware (Rust PoC)"
publish = false

# Standalone: this crate only builds for thumbv6m-none-eabi, so it is excluded
# from the host workspace. Keep the empty table so cargo does not adopt it.
[workspace]

[features]
default = []
# The embassy/embassy-usb stack only builds for the device; host builds expose
# the transport-agnostic runtime so it can be tested with `cargo test`.
hardware = [
    "dep:embassy-executor",
    "dep:embassy-futures",
    "dep:embassy-rp",
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:embassy-usb",
    "dep:cortex-m-rt",
    "dep:panic-halt",
]

[dependencies]
firmware-engine = { path = "../engine" }
embassy-futures = { version = "0.1", optional = true }
embassy-executor = { version = "0.10.0", optional = true, features = [
    "platform-cortex-m",
    "executor-thread",
] }
embassy-rp = { version = "0.10.0", optional = true, features = [
    "critical-section-impl",
    "rp2040",
    "time-driver",
] }
embassy-sync = { version = "0.8.0", optional = true }
embassy-time = { version = "0.5.1", optional = true }
embassy-usb = { version = "0.6.0", optional = true }
cortex-m-rt = { version = "0.7", optional = true }
panic-halt = { version = "1.0", optional = true }

[[bin]]
name = "xiao-firmware"
path = "src/main.rs"
required-features = ["hardware"]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
