[package]
name = "firmware-manage-tool"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Windows 11 Vendor HID firmware manager and input latency tester"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["wgpu", "default_fonts", "accesskit", "x11", "wayland"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "=2.6.7", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Performance", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = "debuginfo"
